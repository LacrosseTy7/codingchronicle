<!DOCTYPE html>

<html>
    <head>
        <link rel="stylesheet" href="../styles/header.css">
        <link href="https://fonts.googleapis.com/css2?family=Edu+TAS+Beginner:wght@400..700&display=swap" rel="stylesheet">

        <title>My Profile</title>
        <link class="icon-link" rel="stylesheet" href="styles/myprofile.css">

        <link rel="icon" href="../images/myprofile">
    </head>
    <body>
        <div class="basic-info-container">
            <h2 class="basic-info-title">Basic Information</h2>
            <span class="username-info basic-info">Username: </span>
            <span class="email-info basic-info">Email: </span>
            <span class="password-info basic-info">Password: </span>
        </div>
        <div class="friends-container">
            <h2 class="friends-info-title">Friends List</h2>
            <span class="friend-code-info">Friend Code: </span>
            <button class="add-friend-button" onclick="addFriend()">Add Friend w/ Friend Code</button>
            <div class="add-friend-container"></div>
            <ul class="friends-list"></ul>
        </div>


        <script src="../scripts/header.js"></script>
        <script src="../data/users.js"></script>


        <script src="scripts/myprofile.js"></script>
    </body>
</html>
