<!DOCTYPE html>

<html>
    <head>
        <link rel="stylesheet" href="../styles/header.css">
        <link href="https://fonts.googleapis.com/css2?family=Edu+TAS+Beginner:wght@400..700&display=swap" rel="stylesheet">

        <title>Games</title>
        <link class="icon-link" rel="icon" href="../images/cc-square-logo">
        
        <link rel="stylesheet" href="styles/games.css">
    </head>
    <body>
        <main class="games-page">
            <section class="page-intro">
                <h1>Pick a game and jump in</h1>
                <p>Choose a challenge that matches your mood and see which one you want to play first.</p>
            </section>

            <section class="games-grid">
                <a class="game-card" href="games/Dont Touch Red/index.html">
                    <img src="images/blocky-run.svg" alt="Blocky Run game preview">
                    <div class="game-card-content">
                        <h2>Blocky Run</h2>
                        <p>Stay quick, dodge the red, and see how far you can go.</p>
                        <span>Play now</span>
                    </div>
                </a>

                <a class="game-card" href="games/Pokemon/index.html">
                    <img src="images/battle-showcase.svg" alt="Fighting game preview">
                    <div class="game-card-content">
                        <h2>Fighting</h2>
                        <p>Step into a battle and test your strategy against powerful opponents.</p>
                        <span>Play now</span>
                    </div>
                </a>
            </section>
        </main>

        <script src="../scripts/header.js"></script>
        <script src="../data/users.js"></script>


        <script src="scripts/games.js"></script>
    </body>
</html>
