<body onkeydown="if (event.key === 'Escape') {location.href = '../../index.html'}">
  <div id="startMenuOverlay" class="menu-overlay">
    <div class="menu-card">
      <div class="menu-content">
        <div class="menu-main">
          <h1>Dont Touch Red</h1>
          <p>Stay away from the red cubes and collect points before the timer runs out.</p>
          <div class="level-selector">
            <button class="level-btn active" data-level="1" type="button">Level 1</button>
            <button class="level-btn" data-level="2" type="button">Level 2</button>
            <button class="level-btn" data-level="3" type="button">Level 3</button>
            <button class="level-btn" data-level="4" type="button">Level 4</button>
          </div>
          <button id="startButton" class="start-button" type="button">Start Game</button>
        </div>
        <div class="menu-stats">
          <h2>High Scores</h2>
          <ol id="highScoreList"></ol>
        </div>
      </div>
    </div>
  </div>
  <div id="scoreDisplay" class="score-display">Points: 0</div>
  <div id="timerDisplay" class="timer-display">Time: 30</div>
  <button id="exitButton" class="exit-button" type="button" onclick="location.href = '../../index.html'">Exit to Games</button>
  <div id="gameOverOverlay" class="game-over-overlay hidden">
    <div class="game-over-card">
      <h1>Game Over</h1>
      <p id="gameOverPoints">Points: 0</p>
      <p id="gameOverAccuracy">Accuracy: 0%</p>
      <div class="game-over-actions">
        <button id="retryButton" type="button">Retry Round</button>
        <button type="button" onclick="location.href = '../../index.html'">Back to Games</button>
      </div>
    </div>
  </div>
</body>

<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/"
    }
  }
</script>

<script type="module">
  import * as THREE from 'three'
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js'

  const scene = new THREE.Scene()
  const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
  )
  camera.position.set(4.61, 2.74, 8)

  const renderer = new THREE.WebGLRenderer({
    alpha: true,
    antialias: true
  })
  renderer.shadowMap.enabled = true
  renderer.setSize(window.innerWidth, window.innerHeight)
  document.body.appendChild(renderer.domElement)

  const controls = new OrbitControls(camera, renderer.domElement)

  class Box extends THREE.Mesh {
    constructor({
      width,
      height,
      depth,
      color = '#00ff00',
      velocity = {
        x: 0,
        y: 0,
        z: 0
      },
      position = {
        x: 0,
        y: 0,
        z: 0
      },
      zAcceleration = false
    }) {
      super(
        new THREE.BoxGeometry(width, height, depth),
        new THREE.MeshStandardMaterial({ color })
      )

      this.width = width
      this.height = height
      this.depth = depth

      this.position.set(position.x, position.y, position.z)

      this.right = this.position.x + this.width / 2
      this.left = this.position.x - this.width / 2

      this.bottom = this.position.y - this.height / 2
      this.top = this.position.y + this.height / 2

      this.front = this.position.z + this.depth / 2
      this.back = this.position.z - this.depth / 2

      this.velocity = velocity
      this.gravity = -0.002

      this.zAcceleration = zAcceleration
      this.isGrounded = false
    }

    updateSides() {
      this.right = this.position.x + this.width / 2
      this.left = this.position.x - this.width / 2

      this.bottom = this.position.y - this.height / 2
      this.top = this.position.y + this.height / 2

      this.front = this.position.z + this.depth / 2
      this.back = this.position.z - this.depth / 2
    }

    update(ground) {
      this.updateSides()

      if (this.zAcceleration) this.velocity.z += 0.0003

      this.position.x += this.velocity.x
      this.position.z += this.velocity.z

      this.applyGravity(ground)
    }

    applyGravity(ground) {
      this.velocity.y += this.gravity

      // this is where we hit the ground
      if (
        boxCollision({
          box1: this,
          box2: ground
        })
      ) {
        this.isGrounded = true
        const friction = 0.5
        this.velocity.y *= friction
        this.velocity.y = -this.velocity.y
      } else {
        this.isGrounded = false
        this.position.y += this.velocity.y
      }
    }
  }

  function boxCollision({ box1, box2 }) {
    const xCollision = box1.right >= box2.left && box1.left <= box2.right
    const yCollision =
      box1.bottom + box1.velocity.y <= box2.top && box1.top >= box2.bottom
    const zCollision = box1.front >= box2.back && box1.back <= box2.front

    return xCollision && yCollision && zCollision
  }

  const cube = new Box({
    width: 1,
    height: 1,
    depth: 1,
    velocity: {
      x: 0,
      y: -0.01,
      z: 0
    }
  })
  cube.castShadow = true
  scene.add(cube)

  const ground = new Box({
    width: 10,
    height: 0.5,
    depth: 50,
    color: '#0369a1',
    position: {
      x: 0,
      y: -2,
      z: 0
    }
  })

  ground.receiveShadow = true
  scene.add(ground)

  const light = new THREE.DirectionalLight(0xffffff, 1)
  light.position.y = 3
  light.position.z = 1
  light.castShadow = true
  scene.add(light)

  scene.add(new THREE.AmbientLight(0xffffff, 0.5))

  camera.position.z = 5
  console.log(ground.top)
  console.log(cube.bottom)

  const keys = {
    a: {
      pressed: false
    },
    d: {
      pressed: false
    },
    s: {
      pressed: false
    },
    w: {
      pressed: false
    }
  }

  window.addEventListener('keydown', (event) => {
    switch (event.code) {
      case 'KeyA', 'ArrowLeft':
        keys.a.pressed = true
        break
      case 'KeyD', 'ArrowRight':
        keys.d.pressed = true
        break
      case 'KeyS', 'ArrowDown':
        keys.s.pressed = true
        break
      case 'KeyW', 'ArrowUp':
        keys.w.pressed = true
        break
      case 'Space':
        if (cube.isGrounded) {
          cube.velocity.y = 0.08
          cube.isGrounded = false
        }
        break
    }
  })

  window.addEventListener('keyup', (event) => {
    switch (event.code) {
      case 'KeyA', 'ArrowLeft':
        keys.a.pressed = false
        break
      case 'KeyD', 'ArrowRight':
        keys.d.pressed = false
        break
      case 'KeyS', 'ArrowDown':
        keys.s.pressed = false
        break
      case 'KeyW', 'ArrowUp':
        keys.w.pressed = false
        break
    }
  })

  const enemies = []

  const levelSettings = {
    1: { label: 'Easy', spawnRate: 200, enemiesPerSpawn: 1, speed: 0.005 },
    2: { label: 'Medium', spawnRate: 150, enemiesPerSpawn: 2, speed: 0.006 },
    3: { label: 'Hard', spawnRate: 110, enemiesPerSpawn: 3, speed: 0.007 },
    4: { label: 'Extreme', spawnRate: 80, enemiesPerSpawn: 4, speed: 0.008 }
  }

  let frames = 0
  let spawnRate = 200
  let enemiesPerSpawn = 1
  let enemySpeed = 0.005
  let selectedLevel = 1
  const roundActiveKey = 'dontTouchRedRoundActive'
  const resumeGameKey = 'dontTouchRedResumeGame'
  const highScoreKey = 'dontTouchRedHighScores'
  let gameStarted = sessionStorage.getItem(resumeGameKey) === 'true'
  let missedPoints = Number(sessionStorage.getItem('dontTouchRedPoints') || 0)
  let timeLeft = Number(sessionStorage.getItem('dontTouchRedTimeLeft') || 30)
  let gameOver = false
  const scoreDisplay = document.getElementById('scoreDisplay')
  const timerDisplay = document.getElementById('timerDisplay')
  const gameOverOverlay = document.getElementById('gameOverOverlay')
  const gameOverPoints = document.getElementById('gameOverPoints')
  const gameOverAccuracy = document.getElementById('gameOverAccuracy')
  const retryButton = document.getElementById('retryButton')
  const startMenuOverlay = document.getElementById('startMenuOverlay')
  const startButton = document.getElementById('startButton')
  const highScoreList = document.getElementById('highScoreList')
  const levelButtons = Array.from(document.querySelectorAll('.level-btn'))

  function updateScoreDisplay() {
    scoreDisplay.textContent = `Points: ${missedPoints}`
    sessionStorage.setItem('dontTouchRedPoints', String(missedPoints))
  }

  function setLevel(level) {
    selectedLevel = level
    const levelConfig = levelSettings[level]
    spawnRate = levelConfig.spawnRate
    enemiesPerSpawn = levelConfig.enemiesPerSpawn
    enemySpeed = levelConfig.speed
    levelButtons.forEach((button) => {
      button.classList.toggle('active', Number(button.dataset.level) === level)
    })
  }

  function getHighScores() {
    const saved = JSON.parse(localStorage.getItem(highScoreKey) || '[]')
    return saved.sort((a, b) => b.score - a.score).slice(0, 5)
  }

  function updateHighScoreList() {
    const scores = getHighScores()
    highScoreList.innerHTML = ''
    if (scores.length === 0) {
      highScoreList.innerHTML = '<li>No scores yet</li>'
      return
    }

    scores.forEach((entry, index) => {
      const item = document.createElement('li')
      item.textContent = `${index + 1}. ${entry.name || 'Player'} — ${entry.score} pts • Level ${entry.level}`
      highScoreList.appendChild(item)
    })
  }

  function saveHighScore() {
    const playerName = prompt('Enter your name for the leaderboard:')
    const trimmedName = (playerName || 'Player').trim().slice(0, 12) || 'Player'
    const scores = getHighScores()
    scores.push({ name: trimmedName, score: missedPoints, level: selectedLevel })
    const ranked = scores.sort((a, b) => b.score - a.score).slice(0, 5)
    localStorage.setItem(highScoreKey, JSON.stringify(ranked))
    updateHighScoreList()
  }

  function resetRoundState() {
    frames = 0
    spawnRate = levelSettings[selectedLevel].spawnRate
    enemiesPerSpawn = levelSettings[selectedLevel].enemiesPerSpawn
    enemySpeed = levelSettings[selectedLevel].speed
    missedPoints = 0
    timeLeft = 30
    gameOver = false
    gameStarted = false
    sessionStorage.setItem('dontTouchRedPoints', '0')
    sessionStorage.setItem('dontTouchRedTimeLeft', '30')
    sessionStorage.setItem('dontTouchRedQuizAttempts', '0')
    sessionStorage.setItem('dontTouchRedQuizCorrect', '0')
    sessionStorage.setItem(roundActiveKey, 'true')
    enemies.forEach((enemy) => scene.remove(enemy))
    enemies.length = 0
    updateScoreDisplay()
    updateTimerDisplay()
    cube.position.set(0, 0, 0)
    cube.velocity.x = 0
    cube.velocity.y = -0.01
    cube.velocity.z = 0
    cube.isGrounded = false
    startMenuOverlay.classList.remove('hidden')
    gameOverOverlay.classList.add('hidden')
  }

  function resetPlayer() {
    cube.position.set(0, 0, 0)
    cube.velocity.x = 0
    cube.velocity.y = -0.01
    cube.velocity.z = 0
    cube.isGrounded = false
    missedPoints = Math.max(0, missedPoints - 5)
    updateScoreDisplay()
  }

  function updateTimerDisplay() {
    timerDisplay.textContent = `Time: ${timeLeft}`
    sessionStorage.setItem('dontTouchRedTimeLeft', String(timeLeft))
  }

  if (gameStarted) {
    startMenuOverlay.classList.add('hidden')
  } else {
    startMenuOverlay.classList.remove('hidden')
  }

  updateScoreDisplay()
  updateTimerDisplay()

  function endGame() {
    if (gameOver) return
    gameOver = true
    gameStarted = false
    sessionStorage.setItem(resumeGameKey, 'false')

    saveHighScore()
    sessionStorage.setItem('dontTouchRedPoints', String(missedPoints))
    const quizAttempts = Number(sessionStorage.getItem('dontTouchRedQuizAttempts') || 0)
    const quizCorrect = Number(sessionStorage.getItem('dontTouchRedQuizCorrect') || 0)
    const accuracy = quizAttempts > 0 ? Math.round((quizCorrect / quizAttempts) * 100) : 0

    gameOverPoints.textContent = `Points: ${missedPoints}`
    gameOverAccuracy.textContent = `Accuracy: ${accuracy}%`
    gameOverOverlay.classList.remove('hidden')
  }

  function startGame() {
    gameStarted = true
    gameOver = false
    sessionStorage.setItem(resumeGameKey, 'true')
    frames = 0
    missedPoints = 0
    timeLeft = 30
    sessionStorage.setItem('dontTouchRedPoints', '0')
    sessionStorage.setItem('dontTouchRedTimeLeft', '30')
    sessionStorage.setItem('dontTouchRedQuizAttempts', '0')
    sessionStorage.setItem('dontTouchRedQuizCorrect', '0')
    sessionStorage.setItem(roundActiveKey, 'true')
    spawnRate = levelSettings[selectedLevel].spawnRate
    enemiesPerSpawn = levelSettings[selectedLevel].enemiesPerSpawn
    enemySpeed = levelSettings[selectedLevel].speed
    enemies.forEach((enemy) => scene.remove(enemy))
    enemies.length = 0
    cube.position.set(0, 0, 0)
    cube.velocity.x = 0
    cube.velocity.y = -0.01
    cube.velocity.z = 0
    cube.isGrounded = false
    updateScoreDisplay()
    updateTimerDisplay()
    startMenuOverlay.classList.add('hidden')
    gameOverOverlay.classList.add('hidden')
  }

  function retryGame() {
    startGame()
  }

  retryButton.addEventListener('click', retryGame)
  startButton.addEventListener('click', startGame)
  levelButtons.forEach((button) => {
    button.addEventListener('click', () => setLevel(Number(button.dataset.level)))
  })

  setLevel(1)
  updateHighScoreList()

  function animate() {
    const animationId = requestAnimationFrame(animate)
    renderer.render(scene, camera)

    if (!gameStarted) return
    if (gameOver) return

    // movement code
    cube.velocity.x = 0
    cube.velocity.z = 0
    if (keys.a.pressed) cube.velocity.x = -0.05
    else if (keys.d.pressed) cube.velocity.x = 0.05

    if (keys.s.pressed) cube.velocity.z = 0.05
    else if (keys.w.pressed) cube.velocity.z = -0.05

    cube.update(ground)

    if (cube.position.y < -6) {
      resetPlayer()
    }

    for (let i = enemies.length - 1; i >= 0; i--) {
      const enemy = enemies[i]
      enemy.update(ground)

      if (
        boxCollision({
          box1: cube,
          box2: enemy
        })
      ) {
        missedPoints = Math.max(0, missedPoints - 1)
        updateScoreDisplay()
        sessionStorage.setItem('dontTouchRedPoints', String(missedPoints))
        sessionStorage.setItem('dontTouchRedTimeLeft', String(timeLeft))
        sessionStorage.setItem(resumeGameKey, 'true')
        cancelAnimationFrame(animationId)
        location.href = 'Questions/index.html'
        return
      }

      if (!enemy.counted && enemy.position.z > cube.position.z + 1.2) {
        enemy.counted = true
        missedPoints++
        updateScoreDisplay()
        scene.remove(enemy)
        enemies.splice(i, 1)
      }
    }

    if (frames % spawnRate === 0) {
      if (spawnRate > 20) spawnRate -= 2

      for (let i = 0; i < enemiesPerSpawn; i++) {
        const enemy = new Box({
          width: 1,
          height: 1,
          depth: 1,
          position: {
            x: (Math.random() - 0.5) * 10,
            y: 0,
            z: -20
          },
          velocity: {
            x: 0,
            y: 0,
            z: enemySpeed
          },
          color: 'red',
          zAcceleration: true
        })
        enemy.counted = false
        enemy.castShadow = true
        scene.add(enemy)
        enemies.push(enemy)
      }
    }

    frames++
    if (frames % 60 === 0) {
      timeLeft--
      updateTimerDisplay()
      if (timeLeft <= 0) {
        sessionStorage.setItem('dontTouchRedTimeLeft', '0')
        endGame()
      }
    }
    // cube.position.y += -0.01
    // cube.rotation.x += 0.01
    // cube.rotation.y += 0.01
  }
  animate()
</script>
