<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rocket Quiz Adventure</title>
  <style>
    body {
      box-sizing: border-box;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(to bottom, #0a0e27 0%, #1a1f3a 50%, #2d1b4e 100%);
      min-height: 100%;
      width: 100%;
      overflow-x: hidden;
      position: relative;
    }
    
    /* Stars background */
    .stars {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    
    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle 3s infinite;
    }
    
    @keyframes twinkle {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    
    .game-container {
      position: relative;
      width: 100%;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    
    .screen {
      display: none;
      width: 100%;
      max-width: 1200px;
    }
    
    .screen.active {
      display: block;
    }
    
    /* Welcome Screen */
    .welcome-screen {
      text-align: center;
      padding: 60px 20px;
    }
    
    .welcome-title {
      font-size: 56px;
      color: #ffd700;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
      margin-bottom: 24px;
      font-weight: bold;
    }
    
    .welcome-text {
      font-size: 22px;
      color: #ffffff;
      margin-bottom: 40px;
      line-height: 1.6;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }
    
    .start-btn {
      background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
      color: white;
      border: none;
      padding: 18px 48px;
      font-size: 24px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(255, 107, 107, 0.4);
      transition: all 0.3s;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    
    .start-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(255, 107, 107, 0.6);
    }
    
    /* Game Screen */
    .game-screen {
      padding: 20px;
    }
    
    .question-area {
      text-align: center;
      margin-bottom: 40px;
    }
    
    .question-number {
      color: #ffd700;
      font-size: 18px;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    
    .question-text {
      font-size: 32px;
      color: #ffffff;
      font-weight: bold;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
      line-height: 1.4;
    }
    
    /* Game Area */
    .game-area {
      position: relative;
      height: 500px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      margin-top: 40px;
    }
    
    .rocket-container {
      position: absolute;
      bottom: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.3s;
    }
    
    .rocket-container:hover {
      transform: translateY(-10px);
    }
    
    .rocket-container.left {
      left: 10%;
    }
    
    .rocket-container.right {
      right: 10%;
    }
    
    .answer-label {
      background: rgba(255, 255, 255, 0.9);
      color: #2d1b4e;
      padding: 16px 24px;
      border-radius: 12px;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      min-width: 200px;
      text-align: center;
    }
    
    .rocket {
      width: 80px;
      height: 120px;
      position: relative;
    }
    
    /* Rocket SVG */
    .rocket svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.5));
    }
    
    /* Person */
    .person {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 80px;
      z-index: 10;
      transition: all 0.5s ease-in-out;
    }
    
    /* Ground */
    .ground {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 80px;
      background: linear-gradient(to bottom, #4a5568, #2d3748);
      border-top: 4px solid #718096;
    }
    
    /* Animation states */
    .rocket-container.launching {
      animation: launch 2s ease-in forwards;
    }
    
    .rocket-container.exploding {
      animation: explode 0.5s ease-out forwards;
    }
    
    @keyframes launch {
      0% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
      100% {
        transform: translateY(-600px) scale(0.5);
        opacity: 0;
      }
    }
    
    @keyframes explode {
      0% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.5);
        opacity: 0.8;
      }
      100% {
        transform: scale(0.1);
        opacity: 0;
      }
    }
    
    .person.boarding-left {
      animation: boardLeft 0.5s ease-in forwards;
    }
    
    .person.boarding-right {
      animation: boardRight 0.5s ease-in forwards;
    }
    
    @keyframes boardLeft {
      to {
        left: 10%;
        transform: translateX(-50%) scale(0.3);
      }
    }
    
    @keyframes boardRight {
      to {
        left: 90%;
        transform: translateX(-50%) scale(0.3);
      }
    }
    
    /* Explosion effect */
    .explosion {
      position: absolute;
      font-size: 100px;
      animation: explosionAnim 1s ease-out;
      pointer-events: none;
    }
    
    @keyframes explosionAnim {
      0% {
        transform: scale(0);
        opacity: 1;
      }
      50% {
        transform: scale(1.5);
        opacity: 1;
      }
      100% {
        transform: scale(2);
        opacity: 0;
      }
    }
    
    /* Fire effect for rocket */
    .fire {
      position: absolute;
      bottom: -20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 40px;
      animation: fireFlicker 0.2s infinite alternate;
      display: none;
    }
    
    .rocket-container.launching .fire {
      display: block;
    }
    
    @keyframes fireFlicker {
      0% {
        transform: translateX(-50%) scale(1);
        opacity: 1;
      }
      100% {
        transform: translateX(-50%) scale(1.2);
        opacity: 0.8;
      }
    }
    
    /* Results Screen */
    .results-screen {
      text-align: center;
      padding: 60px 20px;
    }
    
    .result-emoji {
      font-size: 120px;
      margin-bottom: 24px;
      animation: popIn 0.5s ease-out;
    }
    
    @keyframes popIn {
      0% {
        transform: scale(0);
      }
      50% {
        transform: scale(1.2);
      }
      100% {
        transform: scale(1);
      }
    }
    
    .result-title {
      font-size: 48px;
      color: #ffd700;
      margin-bottom: 24px;
      font-weight: bold;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
    }
    
    .result-message {
      font-size: 24px;
      color: #ffffff;
      margin-bottom: 40px;
      line-height: 1.6;
    }
    
    .score-display {
      font-size: 32px;
      color: #4ade80;
      margin-bottom: 40px;
      font-weight: bold;
    }
    
    .play-again-btn {
      background: linear-gradient(135deg, #4ade80, #22c55e);
      color: white;
      border: none;
      padding: 18px 48px;
      font-size: 24px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(74, 222, 128, 0.4);
      transition: all 0.3s;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    
    .play-again-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(74, 222, 128, 0.6);
    }
    
    @media (max-width: 768px) {
      .welcome-title {
        font-size: 36px;
      }
      
      .question-text {
        font-size: 24px;
      }
      
      .rocket-container.left {
        left: 5%;
      }
      
      .rocket-container.right {
        right: 5%;
      }
      
      .answer-label {
        font-size: 16px;
        padding: 12px 16px;
        min-width: 140px;
      }
      
      .rocket {
        width: 60px;
        height: 90px;
      }
      
      .person {
        font-size: 50px;
      }
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="https://cdn.tailwindcss.com" type="text/javascript"></script>
 </head>

  <div class="game-container"><!-- Welcome Screen -->

       <div class="fire">

     <div class="ground"></div>

   </div><!-- Results Screen -->
   <div id="results-screen" class="screen results-screen">
    <div class="result-emoji" id="result-emoji">
     🎉
    </div>
    <h2 class="result-title" id="result-title">Mission Complete!</h2>
    <div class="score-display" id="score-display">

   </div>
  </div>
  <script src="/_sdk/element_sdk.js"></script>
  <script>
    const defaultConfig = {
      game_title: "🚀 Rocket Quiz Adventure 🚀",
      instruction_text: "Choose the correct answer and blast off into space! Pick the wrong one and... BOOM! 💥 Are you ready for the adventure?",
      start_button: "Launch Game",
      success_message: "Amazing! You're a true space explorer! You answered all questions correctly and safely reached the stars! 🌟",
      failure_message: "Nice try, space cadet! Keep practicing and you'll be flying high in no time! 🚀",
      play_again_button: "Play Again"
    };

    const questionsByDifficulty = {
      beginner: [
        {
          question: "What does HTML stand for?",
          answers: ["Hyper Text Markup Language", "High Tech Modern Language"],
          correct: 0
        },
        {

        },

          answers: ["<button>", "<click>"],

        },
        {
          question: "Which property changes text color in CSS?",
          answers: ["color", "text-color"],
          correct: 0
        },
        {

          answers: ["<h1>", "<heading>"],
          correct: 0
        },
        {
          question: "What tag do you use to add JavaScript to HTML?",
          answers: ["<script>", "<javascript>"],
          correct: 0
        },
        {
          question: "Which CSS property controls text size?",
          answers: ["text-size", "font-size"],

        },
        {

          answers: ["<a>", "<link>"],
          correct: 0
        },
        {

          answers: ["<image>", "<img>"],
          correct: 1
        }
      ],
      intermediate: [
        {
          question: "Which tag is used to link CSS to your HTML file?",
          answers: ["<link>", "<style>"],
          correct: 0
        },
        {
          question: "How do you write a comment in JavaScript?",
          answers: ["<!-- comment -->", "// comment"],
          correct: 1
        },
        {
          question: "How do you select an element by ID in JavaScript?",
          answers: ["document.getElementById()", "document.getElement()"],
          correct: 0
        },
        {
          question: "What symbol is used for class selectors in CSS?",
          answers: [".", "#"],
          correct: 0
        },
        {
          question: "Which CSS property is used for spacing inside elements?",
          answers: ["padding", "margin"],
          correct: 0
        },
        {
          question: "How do you make text bold in CSS?",
          answers: ["font-weight: bold", "text-style: bold"],
          correct: 0
        },
        {
          question: "Which JavaScript method adds an event listener?",
          answers: ["addEventListener()", "attachEvent()"],

        },
        {
          question: "What does the 'display: flex' property do in CSS?",
          answers: ["Creates flexible layouts", "Makes text flexible"],
          correct: 0
        },
        {
          question: "How do you declare a variable in modern JavaScript?",
          answers: ["let/const", "var only"],
          correct: 0
        },
        {
          question: "Which attribute makes an input field required?",
          answers: ["required", "mandatory"],
          correct: 0
        }
      ],
      expert: [
        {
          question: "What is the purpose of the 'async' attribute in script tags?",
          answers: ["Load script asynchronously", "Run script after page loads"],
          correct: 0
        },
        {
          question: "Which CSS unit is relative to the viewport width?",
          answers: ["vw", "rem"],
          correct: 0
        },
        {
          question: "What does 'event.preventDefault()' do?",
          answers: ["Stops default behavior", "Prevents bubbling"],
          correct: 0
        },
        {
          question: "What is a closure in JavaScript?",
          answers: ["Function with access to outer scope", "A closed function"],
          correct: 0
        },
        {
          question: "Which CSS property creates a grid layout?",
          answers: ["display: grid", "layout: grid"],
          correct: 0
        },
        {
          question: "What does the spread operator (...) do in JavaScript?",
          answers: ["Expands iterables", "Spreads text"],
          correct: 0
        },
        {
          question: "What is the difference between '==' and '===' in JS?",
          answers: ["=== checks type and value", "They are the same"],
          correct: 0
        },
        {
          question: "Which CSS pseudo-class targets the first child?",
          answers: [":first-child", ":first-of-type"],
          correct: 0
        },
        {
          question: "What is the Virtual DOM in frameworks?",
          answers: ["In-memory representation", "Fake DOM elements"],
          correct: 0
        },
        {
          question: "What does 'use strict' do in JavaScript?",
          answers: ["Enables strict mode", "Makes code faster"],
          correct: 0
        }
      ]
    };

    let currentDifficulty = 'beginner';
    let questions = [];

    let currentQuestion = 0;
    let score = 0;
    let answering = false;

    async function onConfigChange(config) {
      document.getElementById('game-title').textContent = config.game_title || defaultConfig.game_title;
      document.getElementById('instruction-text').textContent = config.instruction_text || defaultConfig.instruction_text;
      document.getElementById('start-btn').textContent = config.start_button || defaultConfig.start_button;
      document.getElementById('play-again-btn').textContent = config.play_again_button || defaultConfig.play_again_button;
    }

    function mapToEditPanelValues(config) {
      return new Map([
        ["game_title", config.game_title || defaultConfig.game_title],
        ["instruction_text", config.instruction_text || defaultConfig.instruction_text],
        ["start_button", config.start_button || defaultConfig.start_button],
        ["success_message", config.success_message || defaultConfig.success_message],
        ["failure_message", config.failure_message || defaultConfig.failure_message],
        ["play_again_button", config.play_again_button || defaultConfig.play_again_button]
      ]);
    }

    function mapToCapabilities(config) {
      return {
        recolorables: [],
        borderables: [],
        fontEditable: undefined,
        fontSizeable: undefined
      };
    }

    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange,
        mapToCapabilities,
        mapToEditPanelValues
      });
    }

    // Create stars
    function createStars() {
      const starsContainer = document.getElementById('stars');
      for (let i = 0; i < 100; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.style.width = Math.random() * 3 + 'px';
        star.style.height = star.style.width;
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.animationDelay = Math.random() * 3 + 's';
        starsContainer.appendChild(star);
      }
    }

    createStars();

    function shuffleArray(array) {
      const shuffled = [...array];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(screen => {
        screen.classList.remove('active');
      });
      document.getElementById(screenId).classList.add('active');
    }

    function displayQuestion() {
      const question = questions[currentQuestion];
      document.getElementById('question-number').textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
      document.getElementById('question-text').textContent = question.question;
      document.getElementById('left-answer').textContent = question.answers[0];
      document.getElementById('right-answer').textContent = question.answers[1];
      
      // Reset animations
      document.getElementById('left-rocket').className = 'rocket-container left';
      document.getElementById('right-rocket').className = 'rocket-container right';
      document.getElementById('person').className = 'person';
      
      answering = false;
    }

    function selectAnswer(answerIndex, isLeft) {
      if (answering) return;
      answering = true;
      
      const question = questions[currentQuestion];
      const isCorrect = answerIndex === question.correct;
      const person = document.getElementById('person');
      const selectedRocket = isLeft ? document.getElementById('left-rocket') : document.getElementById('right-rocket');
      
      // Person boards rocket
      person.classList.add(isLeft ? 'boarding-left' : 'boarding-right');
      
      setTimeout(() => {
        if (isCorrect) {
          // Launch rocket
          selectedRocket.classList.add('launching');
          score++;
          
          setTimeout(() => {
            currentQuestion++;
            if (currentQuestion < questions.length) {
              displayQuestion();
            } else {
              showResults();
            }
          }, 2000);
        } else {
          // Explode rocket
          selectedRocket.classList.add('exploding');
          
          // Create explosion
          const explosion = document.createElement('div');
          explosion.className = 'explosion';
          explosion.textContent = '💥';
          explosion.style.position = 'absolute';
          explosion.style.bottom = '150px';
          explosion.style.left = isLeft ? '10%' : '90%';
          explosion.style.transform = 'translateX(-50%)';
          document.querySelector('.game-area').appendChild(explosion);
          
          setTimeout(() => {
            explosion.remove();
            currentQuestion++;
            if (currentQuestion < questions.length) {
              displayQuestion();
            } else {
              showResults();
            }
          }, 1500);
        }
      }, 500);
    }

    function showResults() {
      const config = window.elementSdk ? window.elementSdk.config : defaultConfig;
      const percentage = (score / questions.length) * 100;
      
      document.getElementById('score-display').textContent = `Score: ${score}/${questions.length}`;
      
      if (score === questions.length) {
        document.getElementById('result-emoji').textContent = '🎉';
        document.getElementById('result-title').textContent = 'Perfect Launch!';
        document.getElementById('result-message').textContent = config.success_message || defaultConfig.success_message;
      } else if (score >= 7) {
        document.getElementById('result-emoji').textContent = '🚀';
        document.getElementById('result-title').textContent = 'Good Job!';
        document.getElementById('result-message').textContent = config.failure_message || defaultConfig.failure_message;
      } else {
        document.getElementById('result-emoji').textContent = '💥';
        document.getElementById('result-title').textContent = 'Mission Failed';
        document.getElementById('result-message').textContent = config.failure_message || defaultConfig.failure_message;
      }
      
      showScreen('results-screen');
    }

    function resetGame() {
      currentQuestion = 0;
      score = 0;
      answering = false;
      showScreen('welcome-screen');
    }

    // Event listeners
    document.querySelectorAll('.difficulty-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        currentDifficulty = e.currentTarget.dataset.difficulty;
        
        // Update button styles
        document.querySelectorAll('.difficulty-btn').forEach(b => {
          b.style.border = '3px solid transparent';
          b.style.transform = 'scale(1)';
        });
        e.currentTarget.style.border = '3px solid white';
        e.currentTarget.style.transform = 'scale(1.1)';
      });
    });

    document.getElementById('start-btn').addEventListener('click', () => {
      // Shuffle and select questions based on difficulty
      questions = shuffleArray(questionsByDifficulty[currentDifficulty]);
      currentQuestion = 0;
      score = 0;
      showScreen('game-screen');
      displayQuestion();
    });

    document.getElementById('left-rocket').addEventListener('click', () => {
      selectAnswer(0, true);
    });

    document.getElementById('right-rocket').addEventListener('click', () => {
      selectAnswer(1, false);
    });

    document.getElementById('play-again-btn').addEventListener('click', resetGame);
