<!DOCTYPE html>

<html>
    <head>
        <title>Sign In</title>
        <link rel="stylesheet" href="styles/login.css">
        <link rel="icon" href="images/cc-square-logo">
    </head>
    <body>
        <div>
            <img class="gradient-background" src="images/gradient.webp">
            <div class="sign-in-container">
                <img class="cc-icon" src="images/cc-logo">
                <p class="sign-in-text">Sign in</p>
                <p class="empty-words"></p>
                <input onkeydown="if (event.key === 'Enter') {checkForInput()}" class="user-input" type="text" placeholder="Username:">
                <a onclick="" class="forgot-password">Can't access your account?</a>
                <button onclick="checkForInput()" class="next-button">Next</button>
            </div>
        </div>
        <script src="data/users.js"></script>
        <script src="scripts/login.js"></script>
    </body>
</html>
