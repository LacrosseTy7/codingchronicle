<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Quiz Game</title>
  <style>
    body {
      box-sizing: border-box;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100%;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .game-container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 700px;
      width: 100%;
      padding: 40px;
      position: relative;
      overflow: hidden;
    }
    
    .game-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, #667eea, #764ba2, #f093fb);
    }
    
    .screen {
      display: none;
      animation: fadeIn 0.5s ease-in;
    }
    
    .screen.active {
      display: block;
    }
    
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    h1 {
      color: #667eea;
      font-size: 36px;
      margin-bottom: 16px;
      text-align: center;
    }
    
    .welcome-text {
      color: #555;
      font-size: 18px;
      text-align: center;
      margin-bottom: 32px;
      line-height: 1.6;
    }
    
    .start-button, .submit-button, .restart-button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 16px 48px;
      font-size: 18px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      display: block;
      margin: 0 auto;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }
    
    .start-button:hover, .submit-button:hover, .restart-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
    }
    
    .start-button:active, .submit-button:active, .restart-button:active {
      transform: translateY(0);
    }
    
    .progress-bar {
      background: #e0e0e0;
      height: 8px;
      border-radius: 10px;
      margin-bottom: 24px;
      overflow: hidden;
    }
    
    .progress-fill {
      background: linear-gradient(90deg, #667eea, #764ba2);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
      border-radius: 10px;
    }
    
    .question-number {
      color: #667eea;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .question-text {
      color: #333;
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 24px;
      line-height: 1.4;
    }
    
    .answers {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 32px;
    }
    
    .answer-button {
      background: #f5f5f5;
      border: 2px solid #e0e0e0;
      padding: 16px 20px;
      font-size: 16px;
      border-radius: 12px;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
      color: #333;
      font-weight: 500;
    }
    
    .answer-button:hover {
      background: #ebebeb;
      border-color: #667eea;
      transform: translateX(4px);
    }
    
    .answer-button.selected {
      background: #667eea;
      color: white;
      border-color: #667eea;
    }
    
    .answer-button.correct {
      background: #4caf50;
      color: white;
      border-color: #4caf50;
    }
    
    .answer-button.incorrect {
      background: #f44336;
      color: white;
      border-color: #f44336;
    }
    
    .answer-button:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }
    
    .feedback {
      background: #f0f7ff;
      border-left: 4px solid #667eea;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 24px;
      display: none;
      animation: slideIn 0.3s ease;
    }
    
    .feedback.show {
      display: block;
    }
    
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .feedback.correct {
      background: #f1f8f4;
      border-left-color: #4caf50;
    }
    
    .feedback.incorrect {
      background: #fff5f5;
      border-left-color: #f44336;
    }
    
    .feedback-title {
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 16px;
    }
    
    .feedback.correct .feedback-title {
      color: #4caf50;
    }
    
    .feedback.incorrect .feedback-title {
      color: #f44336;
    }
    
    .feedback-text {
      color: #555;
      font-size: 14px;
      line-height: 1.5;
    }
    
    .next-button {
      background: #667eea;
      color: white;
      border: none;
      padding: 12px 32px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      display: none;
      margin: 0 auto;
      transition: background 0.2s;
    }
    
    .next-button.show {
      display: block;
    }
    
    .next-button:hover {
      background: #5568d3;
    }
    
    .score-display {
      text-align: center;
      margin-bottom: 32px;
    }
    
    .score-circle {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
    }
    
    .score-text {
      color: white;
      font-size: 48px;
      font-weight: 700;
    }
    
    .score-label {
      color: #666;
      font-size: 18px;
      margin-bottom: 16px;
    }
    
    .score-message {
      color: #333;
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 32px;
    }
    
    .emoji {
      font-size: 48px;
      margin-bottom: 16px;
    }
    
    @media (max-width: 600px) {
      .game-container {
        padding: 24px;
      }
      
      h1 {
        font-size: 28px;
      }
      
      .question-text {
        font-size: 18px;
      }
      
      .answer-button {
        padding: 14px 16px;
        font-size: 15px;
      }
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="https://cdn.tailwindcss.com" type="text/javascript"></script>
 </head>
 <body>
  <div class="game-container"><!-- Welcome Screen -->
   <div id="welcome-screen" class="screen active">
    <h1 id="game-title">HTML Master Quiz 🎮</h1>
    <p id="welcome-message" class="welcome-text">Test your knowledge of HTML and web development! Answer 10 fun questions about building websites from scratch. Let's see if you can score 100%!</p><button id="start-button" class="start-button">Start Quiz</button>
   </div><!-- Quiz Screen -->
   <div id="quiz-screen" class="screen">
    <div class="progress-bar">
     <div id="progress-fill" class="progress-fill"></div>
    </div>
    <div id="question-number" class="question-number">
     Question 1 of 10
    </div>
    <div id="question-text" class="question-text"></div>
    <div id="answers" class="answers"></div>
    <div id="feedback" class="feedback">
     <div class="feedback-title"></div>
     <div class="feedback-text"></div>
    </div><button id="next-button" class="next-button">Next Question →</button>
   </div><!-- Results Screen -->
   <div id="results-screen" class="screen">
    <div class="emoji">
     🎉
    </div>
    <h1>Quiz Complete!</h1>
    <div class="score-display">
     <div class="score-circle">
      <div id="final-score" class="score-text">
       0%
      </div>
     </div>
     <div class="score-label">
      Your Score
     </div>
     <div id="score-message" class="score-message"></div>
    </div><button id="restart-button" class="restart-button">Play Again</button>
   </div>
  </div>
  <script src="/_sdk/element_sdk.js"></script>
  <script>
    const defaultConfig = {
      game_title: "HTML Master Quiz 🎮",
      welcome_message: "Test your knowledge of HTML and web development! Answer 10 fun questions about building websites from scratch. Let's see if you can score 100%!",
      start_button_text: "Start Quiz",
      perfect_score_message: "Perfect score! You're an HTML master! 🌟",
      good_score_message: "Great job! You know your HTML! 💪",
      retry_message: "Keep practicing! You'll master HTML in no time! 📚",
      play_again_button: "Play Again"
    };

    const questions = [
      {
        question: "What does HTML stand for?",
        answers: [
          "Hyper Text Markup Language",
          "High Tech Modern Language",
          "Home Tool Markup Language",
          "Hyperlinks and Text Markup Language"
        ],
        correct: 0,
        explanation: "HTML stands for Hyper Text Markup Language. It's the standard markup language for creating web pages!"
      },
      {
        question: "Which tag is used to create a hyperlink?",
        answers: ["<link>", "<a>", "<href>", "<url>"],
        correct: 1,
        explanation: "The <a> tag (anchor tag) is used to create hyperlinks. You use the 'href' attribute to specify the destination URL."
      },
      {
        question: "What is the correct way to create a heading in HTML?",
        answers: ["<head>My Heading</head>", "<h1>My Heading</h1>", "<heading>My Heading</heading>", "<title>My Heading</title>"],
        correct: 1,
        explanation: "Headings in HTML use tags <h1> through <h6>, with <h1> being the largest and most important heading."
      },
      {
        question: "Which tag is used to display images?",
        answers: ["<image>", "<picture>", "<img>", "<src>"],
        correct: 2,
        explanation: "The <img> tag is used to embed images. It's a self-closing tag that uses the 'src' attribute to specify the image source."
      },
      {
        question: "What does the <p> tag represent?",
        answers: ["Page", "Picture", "Paragraph", "Preformatted text"],
        correct: 2,
        explanation: "The <p> tag represents a paragraph. It's one of the most commonly used tags for displaying text content."
      },
      {
        question: "Which attribute specifies the destination of a link?",
        answers: ["src", "href", "link", "url"],
        correct: 1,
        explanation: "The 'href' attribute (hypertext reference) specifies the URL destination of a link in an <a> tag."
      },
      {
        question: "What is the purpose of the <div> tag?",
        answers: [
          "To divide the page into sections",
          "To create a container for grouping elements",
          "To display divisions",
          "To create divisions in text"
        ],
        correct: 1,
        explanation: "The <div> tag is a container used to group elements together. It's essential for organizing and styling sections of your webpage."
      },
      {
        question: "Which tag creates a line break?",
        answers: ["<break>", "<lb>", "<br>", "<newline>"],
        correct: 2,
        explanation: "The <br> tag creates a line break. It's a self-closing tag that moves content to the next line."
      },
      {
        question: "What does CSS stand for?",
        answers: [
          "Computer Style Sheets",
          "Cascading Style Sheets",
          "Creative Style System",
          "Colorful Style Sheets"
        ],
        correct: 1,
        explanation: "CSS stands for Cascading Style Sheets. It's used to style and layout web pages written in HTML."
      },
      {
        question: "Which tag is used to create an unordered list?",
        answers: ["<list>", "<ol>", "<ul>", "<ulist>"],
        correct: 2,
        explanation: "The <ul> tag creates an unordered (bulleted) list. Individual list items are created using <li> tags."
      }
    ];

    let currentQuestion = 0;
    let score = 0;
    let selectedAnswer = null;

    async function onConfigChange(config) {
      document.getElementById('game-title').textContent = config.game_title || defaultConfig.game_title;
      document.getElementById('welcome-message').textContent = config.welcome_message || defaultConfig.welcome_message;
      document.getElementById('start-button').textContent = config.start_button_text || defaultConfig.start_button_text;
      document.getElementById('restart-button').textContent = config.play_again_button || defaultConfig.play_again_button;
    }

    function mapToEditPanelValues(config) {
      return new Map([
        ["game_title", config.game_title || defaultConfig.game_title],
        ["welcome_message", config.welcome_message || defaultConfig.welcome_message],
        ["start_button_text", config.start_button_text || defaultConfig.start_button_text],
        ["perfect_score_message", config.perfect_score_message || defaultConfig.perfect_score_message],
        ["good_score_message", config.good_score_message || defaultConfig.good_score_message],
        ["retry_message", config.retry_message || defaultConfig.retry_message],
        ["play_again_button", config.play_again_button || defaultConfig.play_again_button]
      ]);
    }

    function mapToCapabilities(config) {
      return {
        recolorables: [],
        borderables: [],
        fontEditable: undefined,
        fontSizeable: undefined
      };
    }

    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange,
        mapToCapabilities,
        mapToEditPanelValues
      });
    }

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(screen => {
        screen.classList.remove('active');
      });
      document.getElementById(screenId).classList.add('active');
    }

    function updateProgress() {
      const progress = ((currentQuestion + 1) / questions.length) * 100;
      document.getElementById('progress-fill').style.width = progress + '%';
    }

    function displayQuestion() {
      const question = questions[currentQuestion];
      
      document.getElementById('question-number').textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
      document.getElementById('question-text').textContent = question.question;
      
      const answersContainer = document.getElementById('answers');
      answersContainer.innerHTML = '';
      
      question.answers.forEach((answer, index) => {
        const button = document.createElement('button');
        button.className = 'answer-button';
        button.textContent = answer;
        button.onclick = () => selectAnswer(index);
        answersContainer.appendChild(button);
      });
      
      document.getElementById('feedback').classList.remove('show', 'correct', 'incorrect');
      document.getElementById('next-button').classList.remove('show');
      selectedAnswer = null;
      
      updateProgress();
    }

    function selectAnswer(index) {
      if (selectedAnswer !== null) return;
      
      selectedAnswer = index;
      const question = questions[currentQuestion];
      const buttons = document.querySelectorAll('.answer-button');
      const feedback = document.getElementById('feedback');
      const isCorrect = index === question.correct;
      
      buttons.forEach((button, i) => {
        button.disabled = true;
        if (i === question.correct) {
          button.classList.add('correct');
        } else if (i === index && !isCorrect) {
          button.classList.add('incorrect');
        }
      });
      
      if (isCorrect) {
        score++;
        feedback.classList.add('show', 'correct');
        feedback.querySelector('.feedback-title').textContent = '✓ Correct!';
      } else {
        feedback.classList.add('show', 'incorrect');
        feedback.querySelector('.feedback-title').textContent = '✗ Not quite!';
      }
      
      feedback.querySelector('.feedback-text').textContent = question.explanation;
      document.getElementById('next-button').classList.add('show');
    }

    function nextQuestion() {
      currentQuestion++;
      
      if (currentQuestion < questions.length) {
        displayQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      const config = window.elementSdk ? window.elementSdk.config : defaultConfig;
      const percentage = Math.round((score / questions.length) * 100);
      
      document.getElementById('final-score').textContent = percentage + '%';
      
      const scoreMessage = document.getElementById('score-message');
      if (percentage === 100) {
        scoreMessage.textContent = config.perfect_score_message || defaultConfig.perfect_score_message;
      } else if (percentage >= 70) {
        scoreMessage.textContent = config.good_score_message || defaultConfig.good_score_message;
      } else {
        scoreMessage.textContent = config.retry_message || defaultConfig.retry_message;
      }
      
      showScreen('results-screen');
    }

    function restartQuiz() {
      currentQuestion = 0;
      score = 0;
      selectedAnswer = null;
      showScreen('welcome-screen');
    }

    document.getElementById('start-button').addEventListener('click', () => {
      showScreen('quiz-screen');
      displayQuestion();
    });

    document.getElementById('next-button').addEventListener('click', nextQuestion);
    document.getElementById('restart-button').addEventListener('click', restartQuiz);
  </script>

</html>
